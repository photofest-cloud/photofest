<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Galería | PHOTO FEST</title><style>
:root{--bg:#09000d;--panel:#120014;--violet:#9414d1;--cyan:#03b2ed;--pink:#fd59ca;--muted:#9f8aa3;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 15%,rgba(148,20,209,.13),transparent 25%),#09000d;color:#fff;min-height:100vh}button,a{font:inherit}.top{max-width:1180px;margin:auto;padding:24px 30px 8px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:25px;line-height:.72;font-weight:1000;font-style:italic;filter:drop-shadow(0 0 10px rgba(253,89,202,.7))}.brand b,.brand span{display:block}.brand b{color:var(--pink)}.brand span{color:var(--cyan)}.live{font-size:11px;color:#00e6a7;font-weight:800;letter-spacing:.5px}.live:before{content:'●';margin-right:8px}.hero{max-width:1180px;margin:auto;padding:34px 30px 10px}.hero h1{font-size:clamp(36px,7vw,72px);line-height:.92;letter-spacing:-3px;margin:0 0 10px}.meta{font-size:11px;letter-spacing:5px;color:#bba9c0;text-transform:uppercase}.toolbar{max-width:1180px;margin:30px auto 26px;padding:0 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}.tabs{display:flex;gap:30px;border-bottom:1px solid rgba(255,255,255,.12);flex:1}.tab{background:none;border:0;color:#8f7e93;padding:0 0 12px;cursor:pointer;font-size:11px;text-transform:uppercase}.tab.active{color:var(--pink);border-bottom:2px solid var(--pink);box-shadow:0 7px 14px -9px var(--pink)}.newpill{border:1px solid var(--pink);border-right-color:var(--cyan);color:var(--cyan);background:#120016;border-radius:999px;padding:12px 18px;font-size:11px;font-weight:900;box-shadow:0 0 18px rgba(148,20,209,.2)}.status{max-width:1180px;margin:-12px auto 18px;padding:0 30px;color:#7f7084;font-size:11px}.gallery{max-width:1180px;margin:auto;padding:0 30px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo{position:relative;border:1px solid rgba(255,255,255,.2);border-radius:5px;overflow:hidden;background:#150018;aspect-ratio:4/5;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:cover;display:block}.heart{position:absolute;right:10px;bottom:10px;background:transparent;border:0;color:#fff;font-size:25px;text-shadow:0 0 10px rgba(253,89,202,.8);cursor:pointer}.heart.on{color:var(--pink)}.empty{max-width:1180px;margin:auto;padding:20px 30px 80px;color:var(--muted)}.footer{max-width:1180px;margin:auto;padding:24px 30px 50px;display:flex;justify-content:space-between;color:#8e7c91;font-size:10px;letter-spacing:2px}.lightbox{position:fixed;inset:0;background:rgba(5,0,7,.97);z-index:100;display:none;align-items:center;justify-content:center;padding:70px 60px}.lightbox.show{display:flex}.lightbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain}.lb-top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.lb-actions{display:flex;gap:8px}.darkbtn{border:1px solid rgba(255,255,255,.2);background:#140018;color:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;text-decoration:none;font-size:12px}.close{font-size:22px}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:#140018;color:#fff;font-size:22px}.prev{left:18px}.next{right:18px}.counter{font-size:12px;color:#aaa}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;border-radius:999px;padding:11px 16px;font-size:12px;opacity:0;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){.top,.hero,.toolbar,.status,.footer{padding-left:18px;padding-right:18px}.toolbar{align-items:flex-end}.tabs{gap:18px}.newpill{font-size:10px;padding:10px 12px}.gallery{padding:0 8px 60px;grid-template-columns:repeat(2,1fr);gap:7px}.photo{border-radius:4px}.hero h1{font-size:42px}.lightbox{padding:65px 8px 85px}.arrow{top:auto;bottom:18px}.prev{left:20px}.next{right:20px}.lb-actions .darkbtn{padding:9px 10px}.footer{display:block;line-height:2}}
</style></head><body><div class="top"><div class="brand"><b>PHOTO</b><span>FEST</span></div><div class="live">EVENTO EN VIVO</div></div><section class="hero"><h1 id="title">Cargando...</h1><div class="meta" id="meta"></div></section><div class="toolbar"><div class="tabs"><button class="tab active" id="allTab" onclick="setFilter(false)">Todas</button><button class="tab" id="favTab" onclick="setFilter(true)">Favoritas</button><button class="tab" onclick="toastMsg('Descargas individuales disponibles al abrir una foto')">Descargas</button></div><button class="newpill" id="newBtn">✦ <span id="newText">EN VIVO</span></button></div><div class="status" id="status">Conectando…</div><main class="gallery" id="gallery"></main><div class="empty" id="empty" hidden></div><div class="footer"><span>PHOTO FEST</span><span>TUS MOMENTOS · SIEMPRE CONTIGO ♡</span></div><div class="lightbox" id="lightbox" onclick="backdrop(event)"><div class="lb-top"><div class="counter" id="counter"></div><div class="lb-actions"><button class="darkbtn" id="lbFav" onclick="toggleCurrentFav()">♡ Favorita</button><a class="darkbtn" id="download" href="#" download>↓ Descargar</a><button class="darkbtn close" onclick="closeLightbox()">×</button></div></div><button class="arrow prev" onclick="move(-1)">‹</button><img id="bigPhoto" alt="Fotografía"><button class="arrow next" onclick="move(1)">›</button></div><div class="toast" id="toast"></div><script src="config.js"></script><script>
const params=new URLSearchParams(location.search),slug=params.get('evento');const base=(window.PHOTOFEST_SUPABASE_URL||'').replace(/\/$/,''),key=window.PHOTOFEST_SUPABASE_PUBLISHABLE_KEY||window.PHOTOFEST_SUPABASE_KEY||'';const titleEl=document.getElementById('title'),metaEl=document.getElementById('meta'),galleryEl=document.getElementById('gallery'),emptyEl=document.getElementById('empty'),statusEl=document.getElementById('status');let photos=[],current=0,onlyFavs=false,eventId='',checking=false;const favKey='pf_favs_'+(slug||'gallery');let favs=new Set(JSON.parse(localStorage.getItem(favKey)||'[]'));function niceDate(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}).replaceAll('/',' · ')}function photoUrl(path){return`${base}/storage/v1/object/public/photos/${path.split('/').map(encodeURIComponent).join('/')}`}async function get(path){const r=await fetch(`${base}/rest/v1/${path}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});if(!r.ok)throw new Error('No pudimos consultar la galería.');return r.json()}function saveFavs(){localStorage.setItem(favKey,JSON.stringify([...favs]))}function render(){galleryEl.innerHTML='';const shown=photos.map((p,i)=>({...p,_i:i})).filter(p=>!onlyFavs||favs.has(p.storage_path));emptyEl.hidden=shown.length>0;if(!shown.length){emptyEl.textContent=onlyFavs?'Todavía no has guardado fotografías favoritas.':'Todavía no hay fotografías publicadas para este evento.'}shown.forEach(p=>{const card=document.createElement('div');card.className='photo';const url=photoUrl(p.storage_path);card.innerHTML=`<img src="${url}" alt="Fotografía" loading="lazy"><button class="heart ${favs.has(p.storage_path)?'on':''}">${favs.has(p.storage_path)?'♥':'♡'}</button>`;card.querySelector('img').onclick=()=>openLightbox(p._i);card.querySelector('.heart').onclick=e=>{e.stopPropagation();toggleFav(p.storage_path)};galleryEl.appendChild(card)});saveFavs()}function setFilter(f){onlyFavs=f;document.getElementById('allTab').classList.toggle('active',!f);document.getElementById('favTab').classList.toggle('active',f);render()}function toggleFav(path){favs.has(path)?favs.delete(path):favs.add(path);render();if(document.getElementById('lightbox').classList.contains('show'))syncLightbox()}function openLightbox(i){current=i;document.getElementById('lightbox').classList.add('show');document.body.style.overflow='hidden';syncLightbox()}function syncLightbox(){const p=photos[current];if(!p)return;const url=photoUrl(p.storage_path);document.getElementById('bigPhoto').src=url;const dl=document.getElementById('download');dl.href=url;dl.setAttribute('download',p.file_name||'photofest.jpg');document.getElementById('counter').textContent=`${current+1} / ${photos.length}`;document.getElementById('lbFav').textContent=favs.has(p.storage_path)?'♥ Favorita':'♡ Favorita'}function closeLightbox(){document.getElementById('lightbox').classList.remove('show');document.body.style.overflow=''}function backdrop(e){if(e.target.id==='lightbox')closeLightbox()}function move(n){if(!photos.length)return;current=(current+n+photos.length)%photos.length;syncLightbox()}function toggleCurrentFav(){toggleFav(photos[current].storage_path)}function toastMsg(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});async function checkNew(){if(!eventId||checking||document.hidden)return;checking=true;try{const fresh=await get(`photos?event_id=eq.${encodeURIComponent(eventId)}&select=storage_path,file_name,created_at&order=created_at.asc`);if(fresh.length>photos.length){const n=fresh.length-photos.length;photos=fresh;render();document.getElementById('newText').textContent=`${n} FOTO${n===1?'':'S'} NUEVA${n===1?'':'S'}`;toastMsg(`✦ ${n} foto${n===1?' nueva':'s nuevas'}`)}}catch(e){}finally{checking=false}}async function load(){if(!slug){titleEl.textContent='Evento no especificado';return}try{const events=await get(`events?slug=eq.${encodeURIComponent(slug)}&status=eq.active&select=id,name,event_date,location&limit=1`);if(!events.length)throw new Error('Esta galería no está disponible.');const ev=events[0];eventId=ev.id;photos=await get(`photos?event_id=eq.${encodeURIComponent(ev.id)}&select=storage_path,file_name,created_at&order=created_at.asc`);titleEl.textContent=ev.name;metaEl.textContent=[niceDate(ev.event_date),ev.location].filter(Boolean).join(' · ');statusEl.textContent=`${photos.length} fotografía${photos.length===1?'':'s'} disponibles`;render();setInterval(checkNew,6000)}catch(e){titleEl.textContent='Galería no disponible';emptyEl.hidden=false;emptyEl.textContent=e.message}}load();
</script></body></html>
