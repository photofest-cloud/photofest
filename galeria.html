<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Galería | PHOTO FEST</title><style>
:root{--ink:#280120;--deep:#450063;--violet:#9414d1;--cyan:#03b2ed;--pink:#fd59ca;--white:#fff7fd;--muted:#caa8cb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:var(--white);min-height:100vh}button,a{font:inherit}header{position:sticky;top:0;z-index:30;background:rgba(40,1,32,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(253,89,202,.15);padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:3px}.logo span{font-weight:300;color:var(--pink)}.header-actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid rgba(255,255,255,.18);background:rgba(69,0,99,.5);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;cursor:pointer;text-decoration:none}.hero{padding:72px 5% 35px;max-width:1300px;margin:auto;position:relative}.hero:before{content:"";position:absolute;width:260px;height:260px;background:var(--violet);filter:blur(120px);opacity:.22;left:0;top:-40px;pointer-events:none}.eyebrow{text-transform:uppercase;letter-spacing:4px;font-size:10px;color:var(--cyan);position:relative}.hero h1{font-size:clamp(44px,8vw,90px);line-height:.9;letter-spacing:-4px;margin:15px 0;position:relative}.meta{color:var(--muted);font-size:13px}.toolbar{max-width:1300px;margin:0 auto 22px;padding:0 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.status{font-size:12px;color:var(--muted)}.fav-filter.active{background:linear-gradient(90deg,var(--violet),var(--pink));border-color:transparent}.gallery{max-width:1300px;margin:auto;padding:0 5% 100px;columns:3 280px;column-gap:12px}.photo{break-inside:avoid;margin-bottom:12px;border-radius:18px;overflow:hidden;background:var(--deep);position:relative;cursor:zoom-in;border:1px solid rgba(253,89,202,.12)}.photo img{width:100%;display:block;transition:.35s}.photo:hover img{transform:scale(1.015)}.heart{position:absolute;right:10px;top:10px;width:39px;height:39px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(40,1,32,.76);backdrop-filter:blur(8px);color:#fff;font-size:19px;cursor:pointer}.heart.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 25px rgba(253,89,202,.45)}.empty{max-width:1300px;margin:auto;padding:10px 5% 80px;color:var(--muted)}.lightbox{position:fixed;inset:0;background:rgba(22,0,18,.97);z-index:100;display:none;align-items:center;justify-content:center;padding:70px 60px}.lightbox.show{display:flex}.lightbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain}.lb-top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.lb-actions{display:flex;gap:8px}.darkbtn{border:1px solid rgba(255,255,255,.18);background:rgba(69,0,99,.55);color:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;text-decoration:none;font-size:12px}.close{font-size:24px;width:42px;height:42px;padding:0}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:var(--deep);color:#fff;font-size:24px;cursor:pointer}.prev{left:18px}.next{right:18px}.counter{font-size:12px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;border-radius:999px;padding:11px 16px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:700px){header{padding:14px 16px}.header-actions .home{display:none}.hero{padding:50px 20px 26px}.hero h1{letter-spacing:-2px}.toolbar{padding:0 20px}.gallery{padding:0 8px 90px;columns:2 145px;column-gap:7px}.photo{margin-bottom:7px;border-radius:10px}.heart{width:34px;height:34px;right:7px;top:7px}.lightbox{padding:64px 8px 90px}.arrow{top:auto;bottom:20px}.prev{left:20px}.next{right:20px}.lb-top{top:12px;left:12px;right:12px}.lb-actions .darkbtn{padding:9px 11px}}
</style></head><body><header><div class="logo">PHOTO<span>FEST</span></div><div class="header-actions"><button class="pill fav-filter" id="favFilter" onclick="toggleFavFilter()">♡ Favoritas <span id="favCount">0</span></button><a class="pill home" href="index.html">Inicio</a></div></header><section class="hero"><div class="eyebrow">Tu noche · tus recuerdos · ahora</div><h1 id="title">Cargando...</h1><div class="meta" id="meta"></div></section><div class="toolbar"><div class="status" id="status">Conectando…</div><button class="pill" onclick="shareGallery()">Compartir ✦</button></div><main class="gallery" id="gallery"></main><div class="empty" id="empty" hidden></div><div class="lightbox" id="lightbox" onclick="backdrop(event)"><div class="lb-top"><div class="counter" id="counter"></div><div class="lb-actions"><button class="darkbtn" id="lbFav" onclick="toggleCurrentFav()">♡ Favorita</button><a class="darkbtn" id="download" href="#" download>↓ Descargar</a><button class="darkbtn close" onclick="closeLightbox()">×</button></div></div><button class="arrow prev" onclick="move(-1)">‹</button><img id="bigPhoto" alt="Fotografía"><button class="arrow next" onclick="move(1)">›</button></div><div class="toast" id="toast"></div><script src="config.js"></script><script>
const params=new URLSearchParams(location.search),slug=params.get('evento');const base=(window.PHOTOFEST_SUPABASE_URL||'').replace(/\/$/,''),key=window.PHOTOFEST_SUPABASE_PUBLISHABLE_KEY||window.PHOTOFEST_SUPABASE_KEY||'';const titleEl=document.getElementById('title'),metaEl=document.getElementById('meta'),galleryEl=document.getElementById('gallery'),emptyEl=document.getElementById('empty'),statusEl=document.getElementById('status');let photos=[],current=0,onlyFavs=false,eventId='',checking=false;const favKey='pf_favs_'+(slug||'gallery');let favs=new Set(JSON.parse(localStorage.getItem(favKey)||'[]'));function niceDate(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase()}function photoUrl(path){return`${base}/storage/v1/object/public/photos/${path.split('/').map(encodeURIComponent).join('/')}`}async function get(path){const r=await fetch(`${base}/rest/v1/${path}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});if(!r.ok)throw new Error('No pudimos consultar la galería.');return r.json()}function saveFavs(){localStorage.setItem(favKey,JSON.stringify([...favs]));document.getElementById('favCount').textContent=favs.size}function render(){galleryEl.innerHTML='';const shown=photos.map((p,i)=>({...p,_i:i})).filter(p=>!onlyFavs||favs.has(p.storage_path));emptyEl.hidden=shown.length>0;if(!shown.length){emptyEl.textContent=onlyFavs?'Todavía no has guardado fotografías favoritas.':'Todavía no hay fotografías publicadas para este evento.'}shown.forEach(p=>{const card=document.createElement('div');card.className='photo';const url=photoUrl(p.storage_path);card.innerHTML=`<img src="${url}" alt="Fotografía" loading="lazy"><button class="heart ${favs.has(p.storage_path)?'on':''}">${favs.has(p.storage_path)?'♥':'♡'}</button>`;card.querySelector('img').onclick=()=>openLightbox(p._i);card.querySelector('.heart').onclick=e=>{e.stopPropagation();toggleFav(p.storage_path)};galleryEl.appendChild(card)});saveFavs()}function toggleFav(path){favs.has(path)?favs.delete(path):favs.add(path);saveFavs();render();if(document.getElementById('lightbox').classList.contains('show'))syncLightbox()}function toggleFavFilter(){onlyFavs=!onlyFavs;document.getElementById('favFilter').classList.toggle('active',onlyFavs);render()}function openLightbox(i){current=i;document.getElementById('lightbox').classList.add('show');document.body.style.overflow='hidden';syncLightbox()}function syncLightbox(){const p=photos[current];if(!p)return;const url=photoUrl(p.storage_path);document.getElementById('bigPhoto').src=url;const dl=document.getElementById('download');dl.href=url;dl.setAttribute('download',p.file_name||'photofest.jpg');document.getElementById('counter').textContent=`${current+1} / ${photos.length}`;document.getElementById('lbFav').textContent=favs.has(p.storage_path)?'♥ Favorita':'♡ Favorita'}function closeLightbox(){document.getElementById('lightbox').classList.remove('show');document.body.style.overflow=''}function backdrop(e){if(e.target.id==='lightbox')closeLightbox()}function move(n){if(!photos.length)return;current=(current+n+photos.length)%photos.length;syncLightbox()}function toggleCurrentFav(){toggleFav(photos[current].storage_path)}function toastMsg(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}async function shareGallery(){try{if(navigator.share){await navigator.share({title:titleEl.textContent,url:location.href})}else{await navigator.clipboard.writeText(location.href);toastMsg('Enlace copiado')}}catch(e){}}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});async function checkNew(){if(!eventId||checking||document.hidden)return;checking=true;try{const fresh=await get(`photos?event_id=eq.${encodeURIComponent(eventId)}&select=storage_path,file_name,created_at&order=created_at.asc`);if(fresh.length>photos.length){const n=fresh.length-photos.length;photos=fresh;render();statusEl.textContent=`${photos.length} fotografías disponibles`;toastMsg(`✦ ${n} foto${n===1?' nueva':'s nuevas'}`)}}catch(e){}finally{checking=false}}async function load(){if(!slug){titleEl.textContent='Evento no especificado';statusEl.textContent='Sin evento';return}if(!base||!key){titleEl.textContent='Galería sin conectar';return}try{const events=await get(`events?slug=eq.${encodeURIComponent(slug)}&status=eq.active&select=id,name,event_date,location&limit=1`);if(!events.length)throw new Error('Esta galería no está disponible.');const ev=events[0];eventId=ev.id;photos=await get(`photos?event_id=eq.${encodeURIComponent(ev.id)}&select=storage_path,file_name,created_at&order=created_at.asc`);titleEl.textContent=ev.name;metaEl.textContent=[niceDate(ev.event_date),ev.location].filter(Boolean).join(' · ');statusEl.textContent=`${photos.length} fotografía${photos.length===1?'':'s'} disponibles · EN VIVO`;render();setInterval(checkNew,6000)}catch(e){titleEl.textContent='Galería no disponible';statusEl.textContent='';emptyEl.hidden=false;emptyEl.textContent=e.message}}saveFavs();load();
</script></body></html>
