<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Panel | PHOTO FEST</title><style>
:root{--bg:#09000d;--panel:#110014;--panel2:#17001b;--violet:#9414d1;--cyan:#03b2ed;--pink:#fd59ca;--muted:#9d8ba2}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 55% 0,rgba(148,20,209,.09),transparent 25%),var(--bg);color:#fff}a{text-decoration:none;color:inherit}.wrap{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:#0a000d;border-right:1px solid rgba(255,255,255,.1);padding:28px 14px 24px;display:flex;flex-direction:column}.logo{font-size:24px;line-height:.72;font-weight:1000;font-style:italic;margin:0 12px 28px;filter:drop-shadow(0 0 10px rgba(253,89,202,.65))}.logo b,.logo span{display:block}.logo b{color:var(--pink)}.logo span{color:var(--cyan)}nav{display:grid;gap:7px}.nav{padding:12px 14px;border:0;border-radius:6px;background:transparent;color:#b7a8ba;text-align:left;font:inherit;font-size:12px;cursor:pointer}.nav:hover,.nav.active{background:linear-gradient(90deg,rgba(148,20,209,.45),rgba(69,0,99,.6));color:#fff}.nav .ico{display:inline-block;width:22px;color:#d384ff}.logout{margin-top:auto;color:#cdbdd0;font-size:12px;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer}.soon{font-size:8px;color:#6c5d70;margin-left:5px;text-transform:uppercase;letter-spacing:1px}main{padding:42px 5%;max-width:1200px;width:100%}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.hello{font-size:31px;margin:0 0 4px}.sub{color:#ac9caf;font-size:13px}.primary,.btn{border-radius:999px;padding:12px 18px;cursor:pointer;font:inherit}.primary{border:0;background:linear-gradient(90deg,#d91cf0,#9e18ec);color:#fff;font-weight:900;box-shadow:0 0 15px rgba(253,89,202,.55),0 0 35px rgba(148,20,209,.25)}.btn{border:1px solid rgba(255,255,255,.15);background:#18001d;color:#fff;font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:34px 0 14px}.section-head h2{font-size:19px}.section-head button{background:none;border:0;color:var(--pink);cursor:pointer;font-size:11px}.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.event{background:#120014;border:1px solid rgba(253,89,202,.35);border-radius:8px;overflow:hidden;position:relative}.event-cover{height:120px;background:radial-gradient(circle at 60% 30%,rgba(253,89,202,.5),transparent 22%),radial-gradient(circle at 30% 60%,rgba(3,178,237,.22),transparent 25%),linear-gradient(135deg,#270024,#0f0012)}.event-body{padding:16px}.event h3{font-size:16px;margin:0 0 7px}.meta{color:#c2b2c5;font-size:11px;line-height:1.6}.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border-radius:999px;padding:5px 9px;background:#063c2f;color:#32f5b5;font-size:9px}.badge:before{content:'●'}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.manage{border-color:var(--pink);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}.stat{background:#120014;border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:16px}.stat small{color:#8f8093}.stat strong{display:block;font-size:27px;margin-top:9px}.status{margin-top:18px;color:#7f7184;font-size:11px}.status strong{color:#00e6a7}.modal,.login{position:fixed;inset:0;background:rgba(4,0,6,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show,.login.show{display:flex}.card{width:min(460px,100%);background:#130016;border:1px solid rgba(253,89,202,.28);border-radius:10px;padding:25px}.card h2{margin:0 0 6px}.card p,.notice{color:#9f90a3;font-size:12px}.form{display:grid;gap:12px;margin-top:18px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#b6a7b8}.field input{background:#09000d;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:7px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.upload{display:none}@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{display:none}main{padding:28px 18px}.events{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.hello{font-size:27px}}@media(max-width:500px){.row{grid-template-columns:1fr}.top{display:block}.top .primary{margin-top:18px}}
</style></head><body><div class="login show" id="login"><div class="card"><div class="logo"><b>PHOTO</b><span>FEST</span></div><h2>Panel privado</h2><p>Inicia sesión con tu cuenta de fotógrafa.</p><form class="form" onsubmit="signIn(event)"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button class="primary" id="loginBtn">Entrar</button></form><div class="notice" id="loginNotice">Conexión segura con Supabase.</div></div></div><div class="wrap"><aside><div class="logo"><b>PHOTO</b><span>FEST</span></div><nav><button class="nav active" id="navEventos" onclick="showView('eventos')"><span class="ico">▣</span>Eventos</button><button class="nav" onclick="showView('eventos')"><span class="ico">▧</span>Subir fotos</button><a class="nav" href="index.html"><span class="ico">▤</span>Galería</a><button class="nav" disabled><span class="ico">♧</span>Invitados <span class="soon">próximamente</span></button><button class="nav" disabled><span class="ico">⚙</span>Configuración <span class="soon">próximamente</span></button></nav><button class="logout" onclick="signOut()">↪ Cerrar sesión</button></aside><main><section class="view active" id="viewEventos"><div class="top"><div><h1 class="hello">¡Hola, Marely!</h1><div class="sub">Aquí puedes gestionar tus eventos.</div></div><button class="primary" onclick="openModal()">＋ Nuevo evento</button></div><div class="section-head"><h2>Mis eventos</h2><button onclick="loadEvents()">Ver todos →</button></div><div class="events" id="eventsList"></div><div class="stats"><div class="stat"><small>Eventos activos</small><strong id="statEvents">0</strong></div><div class="stat"><small>Fotografías</small><strong id="statPhotos">0</strong></div><div class="stat"><small>Descargas</small><strong>0</strong></div><div class="stat"><small>Escaneos QR</small><strong>0</strong></div></div><div class="status" id="connection">Esperando inicio de sesión…</div></section><section class="view" id="viewResumen"></section></main></div><div class="modal" id="modal"><div class="card"><h2>Nuevo evento</h2><form class="form" onsubmit="createEvent(event)"><div class="field"><label>Nombre</label><input id="name" required></div><div class="row"><div class="field"><label>Fecha</label><input id="date" type="date" required></div><div class="field"><label>Código corto</label><input id="slug" required placeholder="mi-evento"></div></div><div class="field"><label>Ubicación</label><input id="place"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="primary">Crear evento</button></div></form></div></div><script src="config.js"></script><script>
const base=(window.PHOTOFEST_SUPABASE_URL||'').replace(/\/$/,'');const key=window.PHOTOFEST_SUPABASE_KEY||window.PHOTOFEST_SUPABASE_PUBLISHABLE_KEY||'';let token='',events=[];const H=(extra={})=>Object.assign({apikey:key,Authorization:'Bearer '+(token||key)},extra);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}function showView(){document.getElementById('viewEventos').classList.add('active')}async function signIn(e){e.preventDefault();const b=document.getElementById('loginBtn'),email=document.getElementById('email'),password=document.getElementById('password'),notice=document.getElementById('loginNotice');b.disabled=true;b.textContent='Entrando…';try{const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'No se pudo iniciar sesión');token=d.access_token;sessionStorage.setItem('pf_token',token);document.getElementById('login').classList.remove('show');password.value='';await loadEvents()}catch(err){notice.textContent=err.message}finally{b.disabled=false;b.textContent='Entrar'}}async function restore(){token=sessionStorage.getItem('pf_token')||'';if(!token)return;const r=await fetch(base+'/auth/v1/user',{headers:H()});if(r.ok){document.getElementById('login').classList.remove('show');await loadEvents()}else{sessionStorage.removeItem('pf_token');token=''}}async function signOut(){if(token)fetch(base+'/auth/v1/logout',{method:'POST',headers:H()}).catch(()=>{});sessionStorage.removeItem('pf_token');location.reload()}async function loadEvents(){const c=document.getElementById('connection');c.innerHTML='<strong>● Conectado.</strong> Cargando eventos…';const r=await fetch(base+'/rest/v1/events?select=*&order=created_at.desc',{headers:H()});if(!r.ok){c.textContent='No se pudieron cargar los eventos.';return}events=await r.json();for(const ev of events){const p=await fetch(base+'/rest/v1/photos?event_id=eq.'+encodeURIComponent(ev.id)+'&select=id',{headers:H()});ev.photos=p.ok?(await p.json()).length:0}c.innerHTML='<strong>● Sistema conectado.</strong> PHOTO FEST está listo.';render()}function render(){const list=document.getElementById('eventsList');list.innerHTML='';for(const ev of events){const el=document.createElement('article');el.className='event';el.innerHTML=`<div class="event-cover"></div><div class="event-body"><h3>${esc(ev.name)}</h3><div class="meta">${fmt(ev.event_date)}${ev.location?' · '+esc(ev.location):''}<br>${ev.photos||0} fotos</div><span class="badge">${ev.status==='active'?'En vivo':'Finalizado'}</span><div class="actions"><a class="btn manage" href="evento-admin.html?evento=${encodeURIComponent(ev.slug)}">Administrar</a><a class="btn" target="_blank" href="galeria.html?evento=${encodeURIComponent(ev.slug)}">Galería</a><label class="btn">Subir fotos<input class="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadPhotos('${ev.id}','${ev.slug}',this)"></label></div></div>`;list.appendChild(el)}document.getElementById('statEvents').textContent=events.filter(e=>e.status==='active').length;document.getElementById('statPhotos').textContent=events.reduce((n,e)=>n+(e.photos||0),0)}function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}async function createEvent(e){e.preventDefault();const name=document.getElementById('name'),date=document.getElementById('date'),slug=document.getElementById('slug'),place=document.getElementById('place');const s=slug.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const payload={name:name.value.trim(),event_date:date.value,location:place.value.trim()||null,slug:s,status:'active'};const r=await fetch(base+'/rest/v1/events',{method:'POST',headers:H({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify(payload)});if(!r.ok){const d=await r.json().catch(()=>({}));return alert(d.message||'No se pudo crear el evento')}e.target.reset();closeModal();await loadEvents()}function encPath(p){return p.split('/').map(encodeURIComponent).join('/')}async function uploadPhotos(eventId,slug,input){const files=[...input.files];if(!files.length)return;const label=input.parentElement;try{for(let i=0;i<files.length;i++){label.childNodes[0].textContent=`Subiendo ${i+1}/${files.length}…`;const f=files[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=slug+'/'+Date.now()+'-'+i+'-'+safe;const up=await fetch(base+'/storage/v1/object/photos/'+encPath(path),{method:'POST',headers:H({'Content-Type':f.type||'application/octet-stream','x-upsert':'false'}),body:f});if(!up.ok)throw new Error('No se pudo subir '+f.name);const row=await fetch(base+'/rest/v1/photos',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({event_id:eventId,storage_path:path,file_name:f.name})});if(!row.ok)throw new Error('No se pudo registrar '+f.name)}await loadEvents()}catch(err){alert(err.message)}finally{label.childNodes[0].textContent='Subir fotos';input.value=''}}if(base&&key)restore();else document.getElementById('loginNotice').textContent='Falta la configuración de Supabase.';
</script></body></html>
