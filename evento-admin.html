<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gestionar evento | PHOTO FEST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#0e0e0e;color:#fff;min-height:100vh}a{color:inherit}.wrap{max-width:1400px;margin:auto;padding:28px 4% 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:30px}.brand{font-size:15px;letter-spacing:4px}.back{color:#888;text-decoration:none;font-size:13px}.eyebrow{font-size:11px;letter-spacing:3px;color:#777;text-transform:uppercase;margin-bottom:10px}h1{font-size:clamp(38px,6vw,72px);letter-spacing:-3px;line-height:.95}.sub{color:#777;margin-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 30px}.btn,.primary,.danger{border-radius:999px;padding:12px 16px;font-size:12px;cursor:pointer;text-decoration:none;border:1px solid #333;background:#191919;color:#fff}.primary{background:#fff;color:#000;border-color:#fff;font-weight:800}.danger{border-color:#4c2727;color:#ffb3b3}.upload{display:none}.panel{background:#151515;border:1px solid #262626;border-radius:22px;padding:20px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{background:#111;border:1px solid #252525;border-radius:16px;padding:16px}.mini small{color:#777;display:block;margin-bottom:7px}.mini strong{font-size:18px}.qr{display:flex;gap:18px;align-items:center}.qr img{width:150px;height:150px;background:#fff;padding:8px;border-radius:14px}.photos-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:32px 0 15px}.photos-head h2{font-size:24px}.photos-head p{font-size:12px;color:#777}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.photo{position:relative;background:#171717;border:1px solid #252525;border-radius:16px;overflow:hidden;aspect-ratio:1}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .tools{position:absolute;inset:auto 8px 8px 8px;display:flex;justify-content:flex-end}.photo button{border:0;background:rgba(0,0,0,.78);color:#fff;border-radius:999px;padding:9px 11px;cursor:pointer}.empty{grid-column:1/-1;border:1px dashed #333;border-radius:18px;padding:40px;text-align:center;color:#777}.status{padding:12px 14px;border:1px solid #292929;border-radius:14px;background:#141414;color:#888;font-size:12px}.status strong{color:#fff}.hidden{display:none}.uploading{position:fixed;right:18px;bottom:18px;background:#fff;color:#000;padding:14px 18px;border-radius:999px;font-size:12px;font-weight:800;display:none;z-index:20}@media(max-width:900px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}.info{grid-template-columns:1fr 1fr}.top{flex-direction:column}.wrap{padding:22px 20px 50px}}@media(max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}.qr{align-items:flex-start}.qr img{width:120px;height:120px}h1{font-size:46px}}
</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">PHOTO FEST</div><a class="back" href="admin.html">← Volver al panel</a></div><div class="status" id="status">Comprobando sesión…</div></div>
<div class="eyebrow">Gestor de evento</div><h1 id="title">Cargando…</h1><div class="sub" id="subtitle"></div>
<div class="actions"><label class="primary">+ Subir fotos<input id="upload" class="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><a class="btn" id="openGallery" target="_blank">Abrir galería pública</a><button class="btn" id="copyBtn">Copiar enlace</button><button class="btn" id="toggleBtn">Desactivar galería</button></div>
<div class="grid"><div class="panel"><div class="info"><div class="mini"><small>Estado</small><strong id="eventStatus">—</strong></div><div class="mini"><small>Fotografías</small><strong id="photoCount">0</strong></div><div class="mini"><small>Fecha</small><strong id="date">—</strong></div></div></div><div class="panel qr"><img id="qr" alt="QR"><div><small style="color:#777">QR de invitados</small><p style="margin-top:8px;line-height:1.5;color:#aaa">Este código abre la galería pública del evento.</p><button class="btn" id="qrBtn" style="margin-top:12px">Abrir QR</button></div></div></div>
<div class="photos-head"><div><h2>Fotografías</h2><p>Sube más imágenes o elimina las que no quieras mostrar.</p></div></div><section class="photos" id="photos"></section></div><div class="uploading" id="uploading">Subiendo…</div>
<script src="config.js"></script><script>
const base=(window.PHOTOFEST_SUPABASE_URL||'').replace(/\/$/,'');const key=window.PHOTOFEST_SUPABASE_KEY||window.PHOTOFEST_SUPABASE_PUBLISHABLE_KEY||'';let token=sessionStorage.getItem('pf_token')||'';let ev=null,photoRows=[];const params=new URLSearchParams(location.search),slug=params.get('evento');
function headers(extra={}){return Object.assign({apikey:key,Authorization:'Bearer '+token},extra)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function encodePath(p){return p.split('/').map(encodeURIComponent).join('/')}function publicUrl(path){return base+'/storage/v1/object/public/photos/'+encodePath(path)}function galleryUrl(){return location.href.replace(/evento-admin\.html.*$/,'galeria.html?evento='+encodeURIComponent(slug))}function qrUrl(url){return'https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(url)}
async function auth(){if(!token||!slug)return false;const r=await fetch(base+'/auth/v1/user',{headers:headers()});return r.ok}
async function load(){if(!await auth()){location.href='admin.html';return}const r=await fetch(base+'/rest/v1/events?slug=eq.'+encodeURIComponent(slug)+'&select=*',{headers:headers()});const rows=await r.json();if(!r.ok||!rows.length){status.textContent='Evento no encontrado.';title.textContent='Evento no encontrado';return}ev=rows[0];const p=await fetch(base+'/rest/v1/photos?event_id=eq.'+encodeURIComponent(ev.id)+'&select=*&order=created_at.desc',{headers:headers()});photoRows=p.ok?await p.json():[];render();status.innerHTML='<strong>● Sesión activa.</strong> Cambios guardados en Supabase.'}
function render(){title.textContent=ev.name;subtitle.textContent=[ev.location,ev.event_date].filter(Boolean).join(' · ');eventStatus.textContent=ev.status==='active'?'Activo':'Inactivo';photoCount.textContent=photoRows.length;date.textContent=ev.event_date||'—';openGallery.href=galleryUrl();qr.src=qrUrl(galleryUrl());toggleBtn.textContent=ev.status==='active'?'Desactivar galería':'Activar galería';photos.innerHTML='';if(!photoRows.length){photos.innerHTML='<div class="empty">Todavía no hay fotografías en este evento.</div>';return}photoRows.forEach(p=>{const el=document.createElement('article');el.className='photo';el.innerHTML=`<img loading="lazy" src="${publicUrl(p.storage_path)}" alt="${esc(p.file_name)}"><div class="tools"><button onclick="deletePhoto('${p.id}','${String(p.storage_path).replace(/'/g,"\\'")}')">Eliminar</button></div>`;photos.appendChild(el)})}
upload.addEventListener('change',async()=>{const files=[...upload.files];if(!files.length)return;uploading.style.display='block';try{for(let i=0;i<files.length;i++){uploading.textContent=`Subiendo ${i+1}/${files.length}…`;const f=files[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=slug+'/'+Date.now()+'-'+i+'-'+safe;const up=await fetch(base+'/storage/v1/object/photos/'+encodePath(path),{method:'POST',headers:headers({'Content-Type':f.type||'application/octet-stream','x-upsert':'false'}),body:f});if(!up.ok){const d=await up.json().catch(()=>({}));throw new Error(d.message||'No se pudo subir '+f.name)}const row=await fetch(base+'/rest/v1/photos',{method:'POST',headers:headers({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify({event_id:ev.id,storage_path:path,file_name:f.name})});if(!row.ok)throw new Error('La foto subió, pero no se pudo registrar.')}await load()}catch(e){alert(e.message)}finally{upload.value='';uploading.style.display='none'}});
async function deletePhoto(id,path){if(!confirm('¿Eliminar esta fotografía de PHOTO FEST?'))return;const r=await fetch(base+'/rest/v1/photos?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:headers()});if(!r.ok)return alert('No se pudo eliminar el registro.');await fetch(base+'/storage/v1/object/photos/'+encodePath(path),{method:'DELETE',headers:headers()}).catch(()=>{});await load()}
toggleBtn.onclick=async()=>{const next=ev.status==='active'?'inactive':'active';const r=await fetch(base+'/rest/v1/events?id=eq.'+encodeURIComponent(ev.id),{method:'PATCH',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({status:next})});if(!r.ok)return alert('No se pudo cambiar el estado.');ev.status=next;render()};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(galleryUrl());alert('Enlace copiado.')}catch(e){prompt('Copia este enlace:',galleryUrl())}};qrBtn.onclick=()=>window.open(qrUrl(galleryUrl()),'_blank');load();
</script></body></html>
